[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "chameleon"
version = "0.1.0"
description = "Adaptive fault tolerance for distributed training"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
chameleon = "chameleon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
